name: Claude review

# A maintainer comments `/claude-review` on a PR. Claude rewrites the PR description in the /pr template (the
# author's original stays, folded) and keeps one checklist comment that tags the author. It never pushes code
# and never runs on its own. Needs the ANTHROPIC_API_KEY repo secret.
#
# issue_comment workflows run from the default branch, so the rules, prompts and scripts always come from it,
# never from the PR under review.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/claude-review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}

    steps:
      - name: Acknowledge the command
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes

      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The PR's code is read-only context in a subfolder, never the workspace root. Its Claude instruction
      # files are left out so the PR cannot hand the reviewer instructions.
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: pr-head
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !CLAUDE.md
            !CLAUDE.local.md
            !.claude/

      - name: Prepare the review brief
        id: prepare
        run: python3 scripts/pr_review.py prepare

      - name: Review the PR
        id: review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: Read .pr-review-run/brief.md and .github/pr-review/review-prompt.md and follow them.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
            --json-schema '${{ steps.prepare.outputs.review_schema }}'

      - name: Number the new findings
        id: number
        env:
          REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: python3 scripts/pr_review.py number

      - name: Verify the new findings
        id: verify
        if: steps.number.outputs.has_new == 'true'
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: Read .pr-review-run/verify-brief.md and .github/pr-review/verify-prompt.md and follow them.
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
            --json-schema '${{ steps.prepare.outputs.verify_schema }}'

      - name: Publish the comment and the description
        env:
          REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
          VERIFY_OUTPUT: ${{ steps.verify.outputs.structured_output }}
        run: python3 scripts/pr_review.py publish

      - name: Report a failed run
        if: failure()
        run: python3 scripts/pr_review.py fail
