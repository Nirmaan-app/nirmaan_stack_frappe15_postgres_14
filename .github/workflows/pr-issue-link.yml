name: Link PR to an issue

on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review]

concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  link:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const { linkPrIssue } = require('./.github/scripts/link-pr-issue.js');
            core.notice(await linkPrIssue({ github, context, core }));
