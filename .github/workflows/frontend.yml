name: Frontend

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: vitest + typecheck + lint + type-coverage + residence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # The six residence checks that are not ADR-0010 rules (ADR-0049; `ci` = CI_SUBSET in residence_check.py);
      # ADR-0010's five stay local. --check never rewrites scripts/residence_baseline.json: a count that fell
      # passes, a count that rose fails.
      - name: Residence checks (S1 file size, R1 rupee formatters, P1 payment sums, T1 and T2 test data)
        working-directory: .
        run: python3 scripts/residence_check.py --check --only ci

      - name: Install
        run: yarn install --frozen-lockfile
        env:
          # Cypress is a dependency, but neither check runs it.
          CYPRESS_INSTALL_BINARY: 0

      - name: DocType types are current (frontend/src/types/doctypes/ against the DocType JSON)
        working-directory: .
        run: |
          python3 -m unittest scripts.test_generate_doctype_types
          python3 scripts/generate_doctype_types.py --check

      - name: Unit tests
        run: yarn vitest run

      - name: Typecheck (new errors only, against tsc-baseline.json)
        run: yarn typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Lint (typed ESLint; new violations only, against eslint-suppressions.json)
        run: yarn lint

      # Upward only: raise --at-least in package.json in the same PR whenever this percentage rises.
      - name: Type coverage (type-coverage --strict; fails below the threshold in package.json)
        run: yarn type-coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096
